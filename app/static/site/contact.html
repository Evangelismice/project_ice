<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | International Center of Evangelism</title>
  <meta name="description" content="Contact the International Center of Evangelism, Jos.">
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><h1>Contact Us</h1><p>Want to train with us, invite us to your church, or support the work? Send us a message.</p></div></section>
<section class="sec"><div class="wrap two">
<div class="reveal"><p class="eyebrow red">Get In Touch</p><h2>Send us a message</h2>
<p>We will respond as soon as we can.</p>
<address><b>GILGAL, Dong Kasa, Miango Road, Jos</b><br>Plateau State, Nigeria</address>
<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Dong+Kasa+Miango+Road+Jos">Open in Maps</a></div>
<form id="contact-form" class="form reveal">
<label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Subject<input name="subject"></label><label>Message<textarea name="message" rows="5" required></textarea></label>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" type="submit">Send message</button><p id="form-note" class="note" role="status"></p></form></div></section>

<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
