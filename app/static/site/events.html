<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | International Center of Evangelism</title>
  <meta name="description" content="Upcoming events of the International Center of Evangelism, with online registration.">
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="events">
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><h1>Events</h1><p>Upcoming programmes, trainings and camps. Register online to reserve your place.</p></div></section>
<section class="sec"><div class="wrap"><div class="events" id="events"><p class="muted">Loading events...</p></div></div></section>
<dialog id="reg-dialog"><form id="reg-form" class="form" style="padding:0;border:0;background:none">
<h3>Register: <span id="reg-title"></span></h3><input type="hidden" id="reg-event-id">
<label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Phone<input name="phone"></label><label>Church (optional)<input name="church"></label>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="row"><button type="button" class="btn light" id="reg-cancel">Close</button><button class="btn" type="submit">Register</button></div>
<p id="reg-note" class="note" role="status"></p></form></dialog>
<section class="cta-band"><div class="wrap"><h2>Partner with the Great Commission</h2>
<p>Your giving helps equip churches in Nigeria and neighbouring nations to reach the lost, make disciples and plant churches.</p>
<a href="give.html" class="btn">Give Online</a></div></section>
<div id="site-footer"></div>
<script src="js/main.js?v=2"></script>
</body>
</html>
